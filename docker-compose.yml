services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lucaco
      POSTGRES_PASSWORD: lucaco
      POSTGRES_DB: lucaco
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lucaco"]
      interval: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lucaco
      MINIO_ROOT_PASSWORD: lucaco123
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  # SFU de voz/tela. Dev mode: chaves devkey/secret. node-ip = IP que o navegador usa como candidato
  # ICE: `npm run services` passa o IP da LAN (Firefox ignora 127.0.0.1); sem ele cai em loopback.
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - "7880:7880" # HTTP + signaling ws
      - "7881:7881" # RTC sobre TCP
      - "7882:7882/udp" # RTC sobre UDP (porta unica)

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      NODE_ENV: development # secure cookies off over plain http
      DATABASE_URL: postgresql://lucaco:lucaco@postgres:5432/lucaco?schema=public
      S3_ENDPOINT: http://minio:9000
      MONGO_URL: mongodb://mongo:27017/lucaco
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mongo:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
  mongo-data:
